name: Package (Publish to nuget.org)

# Releases the library and its store-contract kit to nuget.org, where anyone can restore them with no
# feed configuration and no credential. Triggered by a `v*` tag, or by hand with an explicit version.
#
# Authentication is nuget.org trusted publishing: this job exchanges its GitHub OIDC token for an API
# key valid for one hour, so no long-lived key is stored anywhere. It needs, once, on nuget.org:
#   - a trusted publishing policy for repository owner `oss-brewers`, repository `Prism-Flowline`,
#     workflow file `publish-package.yml` (the file name only), no environment;
#   - the repository secret NUGET_USER holding the nuget.org profile name (not the email address)
#     of the account that owns the policy.
#
# A prerelease tag (v1.0.0-rc.1) is the way to publish something for integration work; nuget.org
# versions are permanent, so there is deliberately no per-commit publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (defaults to the version in Prism.Flowline.csproj)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write   # the OIDC token trusted publishing exchanges for a temporary API key

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    if: github.repository == 'oss-brewers/Prism-Flowline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Fall back to the version declared in the project file.
            VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Prism.Flowline/Prism.Flowline.csproj)
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing Prism.Flowline and Prism.Flowline.Testing ${VERSION}"

      - name: Restore
        run: dotnet restore

      # Built with the release version, so the assemblies and the packages carry the same one.
      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      # Same reasoning as ci.yml: the broker and store suites skip themselves without a container
      # runtime, and a release must not be cut from a run that quietly tested less than the CI leg did.
      - name: Verify container runtime
        run: docker version

      # Kept in step with ci.yml and the images the test fixtures name.
      - name: Pre-pull test container images
        run: |
          docker pull redis:7-alpine
          docker pull rabbitmq:4-alpine
          docker pull mcr.microsoft.com/mssql/server:2022-latest

      # The package is the product; shipping it untested is not worth the few minutes saved.
      - name: Test
        run: dotnet test -c Release --no-build
        env:
          PRISM_REQUIRE_DOCKER: 'true'

      # Each project produces a .nupkg and a .snupkg; nuget.org takes the symbols beside the package.
      - name: Pack
        run: |
          for project in src/Prism.Flowline/Prism.Flowline.csproj src/Prism.Flowline.Testing/Prism.Flowline.Testing.csproj; do
            dotnet pack "$project" -c Release --no-build -p:Version=${{ steps.version.outputs.value }} -o artifacts
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.value }}
          path: artifacts/*

      # Requested here, just before the push, because the key lasts an hour.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg beside each .nupkg is pushed with it. --skip-duplicate keeps a re-run of the same
      # tag idempotent, since nuget.org refuses to overwrite a published version.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source ${{ env.NUGET_SOURCE }}
          --skip-duplicate
