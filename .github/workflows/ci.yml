name: CI (Build, Test and Publish)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["v*"]

permissions:
  contents: read
  packages: write

env:
  PACKAGE_PROJECT: src/Prism.Flowline/Prism.Flowline.csproj
  FEED: https://nuget.pkg.github.com/oss-brewers/index.json

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitVersion needs full history / tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.15
        with:
          versionSpec: 5.x

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.15
        with:
          useConfigFile: true

      - name: Display Version
        run: |
          echo "NuGetVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.PreReleaseTag }}"

      - name: Restore
        run: dotnet restore
        working-directory: '${{ env.working-directory }}'

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: '${{ env.working-directory }}'

      # The broker suite runs Redis and RabbitMQ through Testcontainers rather than against
      # doubles, and skips itself when no container runtime answers. That is right on a laptop and
      # wrong here: a runner that lost Docker would publish a green build that never touched either
      # broker. Failing at this step names the cause; PRISM_REQUIRE_DOCKER below turns the skip into
      # a failure if it somehow gets past.
      - name: Verify container runtime
        run: |
          docker version
          docker info --format 'storage driver: {{.Driver}}, containers: {{.Containers}}'

      # Pulled up front so an image pull that is slow or rate-limited fails as a pull, rather than
      # inside a test as an inscrutable container-start timeout. Kept in step with the images named
      # in tests/Prism.Flowline.BrokerTests/BrokerFixtures.cs.
      - name: Pre-pull test container images
        run: |
          docker pull redis:7-alpine
          docker pull rabbitmq:4-alpine

      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
        working-directory: '${{ env.working-directory }}'
        env:
          # No container runtime is a broken runner, not a reason to report a smaller green suite.
          PRISM_REQUIRE_DOCKER: 'true'
          # Testcontainers' reaper needs the Docker socket; the hosted runner provides it, and
          # saying so keeps a self-hosted runner from silently leaking containers instead.
          TESTCONTAINERS_RYUK_DISABLED: 'false'

  # Publishes src/Prism.Flowline to GitHub Packages as a CI prerelease.
  #
  # Only master pushes publish. Pull requests and feature branches build and test but never push a
  # package, and the repository guard stops forks (whose GITHUB_TOKEN cannot write here anyway) from
  # attempting it.
  #
  # Versions carry a -ci.<run> suffix so a stable version stays the exclusive product of a tagged
  # release via release.yml / publish-package.yml. That keeps `1.0.0` meaning "released" and orders
  # every CI build below it.
  publish:
    needs: build-test
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && github.repository == 'oss-brewers/Prism-Flowline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.15
        with:
          versionSpec: 5.x

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.15
        with:
          useConfigFile: true

      - name: Compose CI version
        id: version
        run: |
          VERSION="${{ steps.gitversion.outputs.NuGetVersionV2 }}-ci.${{ github.run_number }}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing Prism.Flowline ${VERSION}"

      # Packed without --no-build so the assembly and the package carry the same version; the
      # library is a single project, so the rebuild is cheap.
      - name: Pack
        run: >
          dotnet pack ${{ env.PACKAGE_PROJECT }}
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.value }}
          path: artifacts/*

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source "${FEED}" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

          # --skip-duplicate keeps re-runs idempotent; the feed rejects overwriting a published
          # version. --no-symbols because it does not accept .snupkg.
          dotnet nuget push "artifacts/*.nupkg" \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate \
            --no-symbols
