name: CI (Build, Test and Pack)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["v*"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitVersion needs full history / tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.15
        with:
          versionSpec: 5.x

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.15
        with:
          useConfigFile: true

      - name: Display Version
        run: |
          echo "NuGetVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.PreReleaseTag }}"

      - name: Restore
        run: dotnet restore
        working-directory: '${{ env.working-directory }}'

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: '${{ env.working-directory }}'

      # The broker suite runs Redis and RabbitMQ, and the store suite SQL Server, through
      # Testcontainers rather than against doubles, and both skip themselves when no container
      # runtime answers. That is right on a laptop and wrong here: a runner that lost Docker would
      # publish a green build that never touched a broker or a database. Failing at this step names
      # the cause; PRISM_REQUIRE_DOCKER below turns the skip into a failure if it somehow gets past.
      - name: Verify container runtime
        run: |
          docker version
          docker info --format 'storage driver: {{.Driver}}, containers: {{.Containers}}'

      # Pulled up front so an image pull that is slow or rate-limited fails as a pull, rather than
      # inside a test as an inscrutable container-start timeout. Kept in step with the images named
      # in tests/Prism.Flowline.BrokerTests/BrokerFixtures.cs and
      # tests/Prism.Flowline.StoreTests/SqlServerFixture.cs.
      - name: Pre-pull test container images
        run: |
          docker pull redis:7-alpine
          docker pull rabbitmq:4-alpine
          docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
        working-directory: '${{ env.working-directory }}'
        env:
          # No container runtime is a broken runner, not a reason to report a smaller green suite.
          PRISM_REQUIRE_DOCKER: 'true'
          # Testcontainers' reaper needs the Docker socket; the hosted runner provides it, and
          # saying so keeps a self-hosted runner from silently leaking containers instead.
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      # Every build proves both packages still pack, and leaves them as a workflow artifact for
      # integration work. Nothing is published from here: nuget.org versions are permanent, so a
      # package per commit would bury the real releases. Releases come from a tag, through
      # publish-package.yml. Packed with a rebuild so the assemblies carry the CI version too.
      - name: Pack
        run: |
          VERSION="${{ steps.gitversion.outputs.NuGetVersionV2 }}-ci.${{ github.run_number }}"
          for project in src/Prism.Flowline/Prism.Flowline.csproj src/Prism.Flowline.Testing/Prism.Flowline.Testing.csproj; do
            dotnet pack "$project" --configuration Release -p:Version=${VERSION} -o artifacts
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        working-directory: '${{ env.working-directory }}'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ env.VERSION }}
          path: artifacts/*
